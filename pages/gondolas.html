<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Góndolas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
</head>
<body>
    <noscript><strong>Esta aplicación requiere JavaScript para funcionar.</strong></noscript>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand">Smart Repositor - Gestión de Góndolas</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html" onclick="location.reload();">Inicio</a>
                    </li>
                </ul>
                <span class="navbar-text ms-3" id="manifestVersion">Versión: Cargando...</span>
            </div>
        </div>
    </nav>
  <div class="container mt-5">
    <!-- Formulario para agregar góndola -->
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Agregar Góndola</h5>
        <input
          type="text"
          id="nombreGondola"
          class="form-control mb-2"
          placeholder="Nombre de la góndola"
        />
        <button class="btn btn-primary" onclick="agregarGondola()">
          Agregar Góndola
        </button>
      </div>
    </div>

    <!-- Formulario para buscar producto por PLU y agregarlo a la góndola -->
    <div class="card mt-3">
      <div class="card-body">
        <h5 class="card-title">Buscar Producto y Agregar a Góndola</h5>
        
        <!-- 1) Elegir góndola -->
        <select id="selectGondolaProducto" class="form-select mb-2">
          <!-- Se rellenará dinámicamente con las góndolas -->
        </select>

        <!-- 2) Ingresar PLU -->
        <input
          type="text"
          id="pluProducto"
          class="form-control mb-2"
          placeholder="PLU del producto (ej. 001234)"
        />

        <!-- 3) Mostrar el nombre (viene desde servidor no se renderizara) -->
        <input
          type="text"
          id="nombreProducto"
          class="form-control mb-2"
          placeholder="Nombre del producto (se completa automáticamente)"
          readonly
          style="display: none;"
        />

        <!-- 4) Cantidad -->
        <input
          type="number"
          id="cantidadProducto"
          class="form-control mb-2"
          placeholder="Cantidad a agregar"
        />

        <!-- 5) Botón de acción -->
        <button
          class="btn btn-success"
          id="buscarYAgregarBtn"
          onclick="buscarYAgregarProducto()"
        >
          Buscar y Agregar
        </button>
      </div>
    </div>

    <!-- Lista de góndolas -->
    <h4 class="mt-4">Góndolas Disponibles</h4>
    <div id="listaGondolas"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/gondola.js"></script>
  <script src="../js/registerSW.js"></script>
  <script>
      document.addEventListener("DOMContentLoaded", listarGondolas);
  </script>
</body>
</html>
